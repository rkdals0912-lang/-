<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탑씰 라벨 프로그램</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 메인 컨테이너 (예시 구조) -->
    <div class="main-container">
        
        <!-- 설정 패널 영역 -->
        <div class="control-panel">
            <h2>라벨 서식 편집기</h2>
            
            <!-- 라벨 테두리 표시 여부 체크박스 (신규 추가) -->
            <div class="option-group" style="margin-top: 15px; margin-bottom: 15px;">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold;">
                    <input type="checkbox" id="showBorderToggle" checked style="width: 18px; height: 18px;">
                    <span>라벨 테두리 표시 (인쇄 시 자동 제외)</span>
                </label>
            </div>

            <!-- 기타 설정 요소들이 들어가는 자리 -->
        </div>

        <!-- 라벨 미리보기 및 인쇄 영역 -->
        <div class="preview-area">
            <div class="canvasBox">
                <!-- 라벨 내부 내용 (바코드, 텍스트 등) -->
                <div id="printArea">
                    <p>BIO-4000 바이오 백색</p>
                    <p>Lot. 124 제조일 20260901</p>
                    <!-- 바코드 영역 등 -->
                </div>
            </div>
        </div>

    </div>

    <!-- JS 파일 연결 -->
    <script src="script.js"></script>
</body>
</html>
